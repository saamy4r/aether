name: aether
description: "A Mobile Desktop Environment for managing VPS servers over SSH."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # SSH — pure Dart, channel multiplexing
  dartssh2: ^2.9.0
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  # Terminal emulator
  xterm: ^4.0.0
  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  # File operations
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  # Non-secret persistence
  shared_preferences: ^2.3.2
  # UUID generation
  uuid: ^4.5.1
  # Collection utilities
  collection: ^1.19.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
